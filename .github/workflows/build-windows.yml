name: Build and sign Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-signed-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Signed Release x64
    # This runner must be a protected Windows machine with Visual Studio/WDK,
    # the EV certificate's YubiKey attached, and the label below registered.
    runs-on: [self-hosted, windows, x64, appsandbox-signing]
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify signing runner prerequisites
        shell: pwsh
        run: |
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $requiredTools = @(
            (Get-ChildItem -LiteralPath (Join-Path $kitRoot 'build') -Recurse -Filter 'WindowsDriver.UserMode.UMDF.props' -File -ErrorAction SilentlyContinue | Select-Object -First 1),
            (Get-ChildItem -LiteralPath (Join-Path $kitRoot 'bin') -Recurse -Filter 'Inf2Cat.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1),
            (Get-ChildItem -LiteralPath (Join-Path $kitRoot 'bin') -Recurse -Filter 'signtool.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1),
            (Get-ChildItem -LiteralPath (Join-Path $kitRoot 'bin') -Recurse -Filter 'makecab.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1)
          )

          if ($requiredTools | Where-Object { -not $_ }) {
            throw 'The signing runner is missing one or more Windows SDK/WDK tools.'
          }

          Write-Host 'WDK/UMDF, Inf2Cat, SignTool, and MakeCab are available.'
          Write-Host 'The release script will verify the EV YubiKey and certificate.'

      - name: Create temporary Partner Center credentials
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          foreach ($name in @('PARTNER_CENTER_TENANT_ID', 'PARTNER_CENTER_CLIENT_ID', 'PARTNER_CENTER_CLIENT_SECRET')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Missing required GitHub Secret: $name"
            }
          }

          $credentialPath = Join-Path $env:GITHUB_WORKSPACE 'tools\sign\partner-center.local.json'
          if (Test-Path -LiteralPath $credentialPath) {
            throw "$credentialPath already exists on the signing runner; refusing to overwrite it."
          }

          $credentials = @{
            tenantId     = $env:PARTNER_CENTER_TENANT_ID
            clientId     = $env:PARTNER_CENTER_CLIENT_ID
            clientSecret = $env:PARTNER_CENTER_CLIENT_SECRET
          } | ConvertTo-Json
          Set-Content -LiteralPath $credentialPath -Value $credentials -Encoding utf8
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'appsandbox-partner-credential-created') -Value '1' -Encoding ascii

      - name: Build, EV-sign, attest, and package
        shell: pwsh
        run: |
          # MSBuild's native launcher rejects duplicate PATH/Path entries on
          # some Windows service environments.
          $pathValue = [Environment]::GetEnvironmentVariable('Path', 'Process')
          Remove-Item Env:\PATH -ErrorAction SilentlyContinue
          Remove-Item Env:\Path -ErrorAction SilentlyContinue
          $env:Path = $pathValue

          # The release script invokes Windows PowerShell from driver post-build
          # events; keep PowerShell 7 modules out of that process's module path.
          $env:PSModulePath = "$env:ProgramFiles\WindowsPowerShell\Modules;$env:WINDIR\System32\WindowsPowerShell\v1.0\Modules"

          # No -BuildOnly, -SkipDrivers, or signing bypass is allowed here.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tools\sign\make-release.ps1' `
            -Configuration Release `
            -Platform x64

          if ($LASTEXITCODE -ne 0) {
            throw "The signed release build failed with exit code $LASTEXITCODE."
          }

          $zips = @(Get-ChildItem -LiteralPath '.\bin\Release' -Filter 'AppSandbox-*-win-x64.zip' -File -ErrorAction SilentlyContinue)
          if ($zips.Count -ne 1) {
            throw 'The release script did not produce exactly one signed Windows ZIP. Check the EV token and Partner Center attestation logs.'
          }
          Write-Host "Signed package: $($zips[0].FullName)"

      - name: Verify signed package contents
        shell: pwsh
        run: |
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $signtool = Get-ChildItem -LiteralPath (Join-Path $kitRoot 'bin') -Recurse -Filter 'signtool.exe' -File |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found for signature verification.' }

          $required = @(
            'bin\Release\AppSandbox.exe',
            'bin\Release\appsandbox_core.dll',
            'bin\Release\iso-patch.exe',
            'bin\Release\drivers\AppSandboxVDD.dll',
            'bin\Release\drivers\AppSandboxVAD.sys',
            'bin\Release\drivers\AppSandboxSHM.sys',
            'bin\Release\drivers\AppSandboxVDD.cat',
            'bin\Release\drivers\AppSandboxVAD.cat',
            'bin\Release\drivers\AppSandboxSHM.cat'
          )

          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            throw "Missing signed-release files:`n$($missing -join "`n")"
          }

          foreach ($file in $required | Where-Object { $_ -match '\.(exe|dll|sys|cat)$' }) {
            & $signtool.FullName verify /pa /all $file | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $file."
            }
          }
          Write-Host 'Application and driver signatures verified.'

      - name: Upload signed Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AppSandbox-windows-x64-signed
          path: bin/Release/AppSandbox-*-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Partner Center credentials
        if: always()
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'appsandbox-partner-credential-created'
          $credentialPath = Join-Path $env:GITHUB_WORKSPACE 'tools\sign\partner-center.local.json'
          if (Test-Path -LiteralPath $marker) {
            Remove-Item -LiteralPath $credentialPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          }
